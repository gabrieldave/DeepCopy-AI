name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
          test -s "$GITHUB_WORKSPACE/release.jks"

      - name: Assemble release APK
        env:
          # BYOK: nunca inyectar API keys en BuildConfig/release.
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease

      - name: Resolve versionName from APK
        id: ver
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$SRC"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -n 1)
          BADGING=$("$AAPT2" dump badging "$SRC" | head -n 1)
          VNAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VCODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "versionName=$VNAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VCODE" >> "$GITHUB_OUTPUT"
          DEST="KlipNote-v${VNAME}.apk"
          cp "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"
          echo "Resolved versionCode=$VCODE versionName=$VNAME"
          ls -lh "$DEST"
          # Guardrail: nunca publicar por debajo del piso comercial 112
          if [ "${VCODE:-0}" -lt 112 ]; then
            echo "versionCode $VCODE < 112 — abort"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlipNote-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.versionName }}"
          NOTES="KlipNote release APK firmado — ${TAG} (versionCode ${{ steps.ver.outputs.versionCode }}, router STT en cascada, BYOK cifrado, sin llaves en APK)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$APK_PATH" \
            --title "KlipNote $TAG" \
            --notes "$NOTES" \
            --latest

      - name: Cleanup keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"
