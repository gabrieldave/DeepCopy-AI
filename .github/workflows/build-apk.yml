name: Build APK

# - Repo principal (con los secretos del keystore): compila el APK firmado y crea un GitHub Release.
# - Forks o repos sin secretos: compila un APK debug y lo deja como artefacto descargable (sin Release).
# - El APK nunca lleva API keys: cada usuario pone las suyas dentro de la app.

on:
  push:
    branches: [main]
    paths-ignore:
      - "config/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.9"

      - name: Detect signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Sin keystore: se compilará un APK debug (normal en forks y Pull Requests)."
          fi

      # ---------- Camino 1: APK firmado + Release (repo principal) ----------
      - name: Decode release keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
          test -s "$GITHUB_WORKSPACE/release.jks"

      - name: Assemble release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleRelease --console=plain

      # ---------- Camino 2: APK debug (forks / PRs) ----------
      - name: Assemble debug APK
        if: steps.signing.outputs.signed != 'true'
        run: gradle assembleDebug --console=plain

      - name: Resolve APK and version
        id: ver
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          test -n "$SRC"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -n 1)
          BADGING=$("$AAPT2" dump badging "$SRC" | head -n 1)
          VNAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VCODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "versionName=$VNAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VCODE" >> "$GITHUB_OUTPUT"
          # versionNameSuffix="-debug" del buildType ya va en VNAME; no duplicar.
          DEST="KlipNote-v${VNAME}.apk"
          cp "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"
          ls -lh "$DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KlipNote-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.versionName }}"
          NOTES="KlipNote ${TAG} — APK firmado. Gratis y de código abierto. Pon tus propias llaves en la app (Motores → API Keys). Guía: README."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" --title "KlipNote $TAG" --notes "$NOTES" --latest
          fi

      - name: Cleanup keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"
